<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Saturn and constellation badge">
  <rect width="64" height="64" rx="14" fill="#08152e"/>
  <!-- distant stars -->
  <circle cx="10" cy="14" r="1" fill="#f5c842"/>
  <circle cx="54" cy="11" r="1.4" fill="#c4aff5"/>
  <circle cx="14" cy="48" r="1" fill="#ffd966"/>
  <circle cx="55" cy="52" r="1.2" fill="#9b7fe8"/>
  <circle cx="48" cy="40" r="0.9" fill="#fff"/>
  <circle cx="10" cy="32" r="0.8" fill="#fff"/>
  <!-- saturn ring (back half) -->
  <ellipse cx="32" cy="32" rx="20" ry="6" fill="none" stroke="#f5c842" stroke-width="2" opacity="0.9"/>
  <!-- planet body -->
  <circle cx="32" cy="32" r="11" fill="#9b7fe8"/>
  <path d="M22 32a10 10 0 0 1 20 0a10 10 0 0 1-20 0" fill="#c4aff5" opacity="0.55"/>
  <path d="M24 28c4 2 12 2 16 0M24 36c4 2 12 2 16 0" stroke="#7a5fd0" stroke-width="1.2" fill="none" opacity="0.7"/>
  <!-- saturn ring (front half) -->
  <path d="M12 32a20 6 0 0 0 40 0" fill="none" stroke="#ffd966" stroke-width="2.5" stroke-linecap="round"/>
  <!-- bright star -->
  <path d="M50 16l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5z" fill="#f5c842"/>
  <!-- shooting comet -->
  <path d="M8 56l8-7" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <circle cx="16" cy="49" r="1.6" fill="#fff"/>
</svg>
