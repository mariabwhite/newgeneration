<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Premium Login · NG English</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="../assets/nge-favicon-lab.svg">
<script src="./assets/lab-theme-sync.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f1ff;
  --panel: #ffffff;
  --text: #1a1326;
  --muted: #625a73;
  --line: rgba(122,95,207,0.24);
  --accent: #ff7430;
  --accent-2: #ff5125;
  --ok: #168a5f;
  --err: #c73535;
  --display: "Unbounded", "Manrope", system-ui, sans-serif;
  --body: "Manrope", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
}
[data-theme="dark"], [data-theme="black-lab"], [data-theme="violet"] {
  --bg: #0e0a18;
  --panel: #1a1326;
  --text: #f0ebff;
  --muted: #bfaee0;
  --line: rgba(197,174,240,0.24);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 16px;
  font-family: var(--body);
  color: var(--text);
  background:
    radial-gradient(circle at 82% 8%, rgba(154,122,217,0.24), transparent 36%),
    radial-gradient(circle at 8% 88%, rgba(255,116,48,0.12), transparent 34%),
    var(--bg);
  overflow-x: hidden;
}
.login {
  width: 100%;
  max-width: min(300px, calc(100vw - 32px));
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 26px 18px 22px;
  box-shadow: 0 24px 70px rgba(25, 18, 42, 0.18);
  overflow: hidden;
}
.eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 12px;
}
h1 {
  margin: 0 0 10px;
  font-family: var(--display);
  font-size: clamp(26px, 7vw, 34px);
  line-height: 1.05;
}
p {
  margin: 0 0 18px;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.45;
  overflow-wrap: anywhere;
}
form { margin: 0; }
label {
  display: block;
  margin: 0 0 8px;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.13em;
  text-transform: uppercase;
}
input {
  width: 100%;
  min-width: 0;
  min-height: 52px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--text);
  font: 700 18px var(--mono);
  padding: 0 14px;
  outline: none;
}
input:focus {
  border-color: rgba(255,116,48,0.72);
  box-shadow: 0 0 0 4px rgba(255,116,48,0.12);
}
.actions {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-top: 14px;
}
button, a {
  min-height: 48px;
  border-radius: 10px;
  border: 1px solid var(--line);
  padding: 0 16px;
  font: 800 13px var(--body);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: var(--text);
}
button {
  background: linear-gradient(180deg, var(--accent) 0%, var(--accent-2) 100%);
  border-color: rgba(255,116,48,0.72);
  color: #fff;
  cursor: pointer;
}
button:disabled { opacity: 0.62; cursor: wait; }
a { background: transparent; }
.msg {
  min-height: 22px;
  margin-top: 14px;
  font-size: 14px;
  color: var(--muted);
}
.msg.is-ok { color: var(--ok); }
.msg.is-error { color: var(--err); }
.reset {
  margin-top: 18px;
  width: 100%;
}
@media (max-width: 430px) {
  .login { max-width: calc(100vw - 24px); padding: 22px 16px 18px; }
}
</style>

<body>
  <main class="login">
    <div class="eyebrow">NG English · Premium</div>
    <h1>Вход в Lab</h1>
    <p id="lead">Введите PIN. После входа уроки будут открываться в этом браузере.</p>
    <form id="loginForm" novalidate>
      <input type="hidden" id="nextInput" name="next" value="">
      <label for="pinInput">PIN</label>
      <input id="pinInput" name="pin" type="text" autocomplete="off" spellcheck="false" maxlength="40" autofocus>
      <div class="actions">
        <button id="loginBtn" type="submit" disabled>Открыть</button>
        <a href="./premium.html">Каталог</a>
      </div>
    </form>
    <div class="msg" id="msg">PIN чувствителен к дефисам и цифрам.</div>
    <button class="reset" id="resetBtn" type="button">Сбросить доступ</button>
  </main>

<script>
const cacheKey = 'nge-vault-cache';
const cacheVersionKey = 'nge-vault-cache-v';
const loginForm = document.getElementById('loginForm');
const input = document.getElementById('pinInput');
const btn = document.getElementById('loginBtn');
const resetBtn = document.getElementById('resetBtn');
const msg = document.getElementById('msg');
const nextInput = document.getElementById('nextInput');
const lead = document.getElementById('lead');
let serverMode = null;

function b64(s) {
  return Uint8Array.from(atob(s), c => c.charCodeAt(0));
}

function safeNextUrl() {
  const next = new URLSearchParams(location.search).get('next');
  if (!next) return './premium.html';
  try {
    const url = new URL(next, location.origin);
    if (url.origin !== location.origin) return './premium.html';
    if (!url.pathname.startsWith('/lingua-boost-lab/')) return './premium.html';
    if (url.pathname.endsWith('/login.html')) return './premium.html';
    return url.pathname + url.search + url.hash;
  } catch (e) {
    return './premium.html';
  }
}

function setReady(ready) {
  btn.disabled = !ready;
}

async function probeServerMode() {
  try {
    const response = await fetch('/api/premium-lessons', {
      credentials: 'include',
      cache: 'no-store',
    });
    if (response.status === 404) {
      serverMode = false;
      setReady(true);
      return;
    }
    serverMode = true;
    if (response.ok) {
      location.replace(safeNextUrl());
      return;
    }
    lead.textContent = 'Серверный вход активен. Введите PIN.';
    setReady(true);
  } catch (error) {
    serverMode = false;
    lead.textContent = 'Локальный режим. Введите PIN.';
    setReady(true);
  }
}

async function loadVault() {
  const response = await fetch('./premium.html', { cache: 'no-store' });
  const html = await response.text();
  const version = (html.match(/<meta name="vault-version" content="([^"]+)">/) || [])[1] || 'v0';
  const salt = (html.match(/salt:\s*"([^"]+)"/) || [])[1];
  const iv = (html.match(/iv:\s*"([^"]+)"/) || [])[1];
  const ct = (html.match(/ct:\s*"([^"]+)"/) || [])[1];
  const iter = Number((html.match(/iter:\s*(\d+)/) || [])[1] || 0);
  if (!salt || !iv || !ct || !iter) throw new Error('Vault not found');
  return { version, salt, iv, ct, iter };
}

async function decryptUrls(pin) {
  const vault = await loadVault();
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(vault.salt), iterations: vault.iter, hash: 'SHA-256' },
    km,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(vault.iv) }, key, b64(vault.ct));
  return { lessons: JSON.parse(new TextDecoder().decode(plain)), version: vault.version };
}

async function serverLogin(pin) {
  const response = await fetch('/api/premium-login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({ pin, next: safeNextUrl() }),
  });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok || !payload.ok) {
    throw new Error(payload.error || 'SERVER_LOGIN_FAILED');
  }
  msg.textContent = 'Доступ открыт.';
  msg.className = 'msg is-ok';
  input.value = '';
  const redirectTo = payload.redirectTo || safeNextUrl();
  if (redirectTo && redirectTo !== '/lingua-boost-lab/login.html') {
    location.replace(redirectTo);
  }
}

async function localLogin(pin) {
  const result = await decryptUrls(pin);
  localStorage.setItem(cacheKey, JSON.stringify(result.lessons));
  localStorage.setItem(cacheVersionKey, result.version);
  msg.textContent = 'Доступ открыт.';
  msg.className = 'msg is-ok';
  input.value = '';
  location.replace(safeNextUrl());
}

async function login(event) {
  event.preventDefault();
  const pin = input.value.trim();
  if (!pin) {
    msg.textContent = 'Введите PIN.';
    msg.className = 'msg is-error';
    return;
  }
  btn.disabled = true;
  msg.textContent = 'Проверяю...';
  msg.className = 'msg';
  try {
    if (serverMode === true) {
      await serverLogin(pin);
    } else {
      await localLogin(pin);
    }
  } catch (error) {
    btn.disabled = false;
    msg.textContent = 'PIN не подошел. Проверьте дефисы и цифры.';
    msg.className = 'msg is-error';
  }
}

async function resetAccess() {
  localStorage.removeItem(cacheKey);
  localStorage.removeItem(cacheVersionKey);
  localStorage.removeItem('nge-vault-pin');
  sessionStorage.removeItem(cacheKey);
  sessionStorage.removeItem(cacheVersionKey);
  msg.textContent = 'Доступ сброшен.';
  msg.className = 'msg';
  input.value = '';
  try {
    await fetch('/api/premium-logout?next=' + encodeURIComponent('/lingua-boost-lab/login.html'), {
      credentials: 'include',
      cache: 'no-store',
    });
  } catch (error) {}
  location.replace('/lingua-boost-lab/login.html');
}

loginForm.addEventListener('submit', login);
resetBtn.addEventListener('click', resetAccess);
nextInput.value = safeNextUrl();
setReady(false);
probeServerMode();
</script>
</body>
</html>
